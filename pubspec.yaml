name: lingua_school
description: "Lingua School — Student Management App for Language Schools"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.3.2
  path: ^1.9.0

  # File system & sharing
  path_provider: ^2.1.4
  share_plus: ^10.1.4

  # File picker for CSV import
  file_picker: ^8.1.2

  # CSV encode/decode
  csv: ^6.0.0

  # Native device integrations (tel: / sms: URLs)
  url_launcher: ^6.3.1

  # Date formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  # Native splash screen generator
  flutter_native_splash: ^2.4.1

  # Launcher icon generator
  flutter_launcher_icons: ^0.14.1

# ─── Native Splash Screen ────────────────────────────────────────────────────
flutter_native_splash:
  color: "#06402B"                      # Dark Forest Green background
  image: assets/images/splash_logo.png  # Centered gold LS monogram
  android: true
  ios: true
  web: false
  android_12:
    color: "#06402B"
    image: assets/images/splash_logo.png
    icon_background_color: "#06402B"

# ─── Launcher Icons ──────────────────────────────────────────────────────────
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#06402B"
  adaptive_icon_foreground: "assets/images/app_icon.png"
  web:
    generate: false

# ─── Flutter Config ───────────────────────────────────────────────────────────
flutter:
  uses-material-design: true
  assets:
    - assets/images/
